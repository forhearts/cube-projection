schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  项目：「方之投影」（Cube's Projection）—— 开放群创世界观项目，载体是一个 MediaWiki 站点。
  底层公理：①存在独立于任何描述；②任何描述都不能完整表达存在。（详见 reference/plan.md、worldbuilding/）

  目录结构：
  - code/            wiki 页面源码，本地路径 ↔ wiki 页面名一一对应（无文件后缀）
    - MediaWiki/*.js|css  → MediaWiki: 命名空间（Common.js 资源注入器、Fluid/Ink/Search/NavAccount/Console/Archive 等）
    - Module/*        → 模块:（Lua / Scribunto：Libs、Rehead、Navbar、NavbarLight、NavAccount、DocsNav）
    - Template/*      → 模板:（libs、rehead、Navbar、docs/layout、docs/end 等）
    - File/*.svg      → 文件:（站点图标，Module 中按文件名引用）
    - docs/*          → Docs: 命名空间（编写指南，docs/README.md 为索引；侧边栏菜单数据在 docs/navigation）
    - Tool/、Test/、首页、论坛、观测档案库 → 对应主命名空间页面
  - worldbuilding/   世界观设定文档（Markdown）
  - reference/       项目设计大纲
  - prototypes/      静态 HTML 原型，不是 wiki 页面
  - _local/          本地专用（gitignore）：线上页面快照（含 csrfToken）、调试文件、已废弃的本地托管库 —— 仅作参考，不要修改或引用进产物
  - bot/             机器人凭据（gitignore）—— 敏感，禁止读取、引用或写入任何产物

  技术约定：
  - 职责划分：Lua 优先（URL 生成/去重/消毒、HTML 生成在 Module 中完成），JS 只做浏览器端必须的事。
  - 页面通过 {{libs|css=...|js=...|cleanup=|rehead=}} 声明前端资源，由 Module:Libs 生成 JSON、MediaWiki:Common.js 注入。
  - 第三方库一律走 jsdelivr CDN（Miraheze CSP 白名单），本站不托管第三方 JS/CSS。
  - UI 框架：daisyUI + Tailwind（亦可用 Bootstrap 等 Module:Libs 中已注册的库）；文档页正文直接用 Bootstrap 原生类。
  - 模板参数中链接用「文本,目标;文本,目标」格式，避免 | 转义问题。
  - 无构建流程、无自动化测试；变更通过手动上传到 wiki 生效，验证方式为在 wiki 上预览/浏览页面。

rules:
  proposal:
    - 列出受影响的 wiki 页面（同时给出本地路径与 wiki 页面名，如 code/Module/Navbar → 模块:Navbar）
    - 说明不在范围内的内容
  design:
    - 遵守 Lua 优先、JS 最小化的职责划分；若违背须说明理由
  tasks:
    - 每个任务指明要修改的本地文件
    - 最后包含「上传到 wiki 并在线验证」的任务，列出需上传的页面清单及上传顺序（被依赖的 Module/Template 先上传）

operations:
  apply:
    guidance:
      - 只修改 code/ 等源码目录，不要修改 _local/ 与 bot/
      - 新增文档页时同步更新 code/docs/navigation 与 code/docs/README.md
